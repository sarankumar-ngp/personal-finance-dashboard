<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinanceFlow - Analytics</title>
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="app-container">
      <!-- Navigation Sidebar -->
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-icon">FF</div>
          <span>FinanceFlow</span>
        </div>
        <nav>
          <ul class="nav-list">
            <li>
              <a href="index.html" class="nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21.75h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21.75h7.5" />
                </svg>
                <span>Dashboard</span>
              </a>
            </li>
            <li>
              <a href="analytics.html" class="nav-link active">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6a7.5 7.5 0 107.5 7.5h-7.5V6z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5H21A7.5 7.5 0 0013.5 3v7.5z" />
                </svg>
                <span>Analytics</span>
              </a>
            </li>
            <li>
              <a href="transactions.html" class="nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12M8.25 17.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                </svg>
                <span>Transactions</span>
              </a>
            </li>
          </ul>
        </nav>
        <div class="nav-footer">
          <div class="user-profile">
            <div class="user-avatar">UD</div>
            <div class="user-info">
              <div class="user-name">User Dashboard</div>
              <div class="user-role">Personal Plan</div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Layout -->
      <main class="main-content">
        <header class="content-header">
          <div class="greeting">
            <h1>Financial Analytics</h1>
            <p>Visual analysis of your expenses, budgets, and savings goals.</p>
          </div>
          <div class="header-actions">
            <button class="btn btn-primary" id="btn-add-goal">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" style="width:16px;height:16px;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
              </svg>
              Add Goal
            </button>
          </div>
        </header>

        <!-- Main Analytics Section -->
        <section class="dashboard-grid">
          <!-- Expense Distribution (Doughnut Chart) -->
          <div class="card-glass chart-card">
            <div class="card-title-row">
              <h2>Expense by Category</h2>
            </div>
            <div class="chart-container">
              <canvas id="category-chart"></canvas>
            </div>
          </div>

          <!-- Budget Progress Card -->
          <div class="card-glass">
            <div class="card-title-row">
              <h2>Monthly Budgets</h2>
            </div>
            <div class="budget-list" id="budget-progress-container">
              <!-- Rendered Dynamically -->
            </div>
          </div>
        </section>

        <!-- Savings Goals Section -->
        <section>
          <div class="card-title-row" style="margin-bottom: 1.5rem;">
            <h2 style="font-size:1.5rem; font-weight:700;">Active Savings Goals</h2>
          </div>
          <div class="goals-grid" id="goals-container">
            <!-- Rendered Dynamically -->
          </div>
        </section>
      </main>
    </div>

    <!-- Add Savings Goal Modal -->
    <div class="modal-overlay" id="goal-modal">
      <div class="modal-card">
        <div class="modal-header">
          <h2>Create Savings Goal</h2>
          <button class="modal-close-btn" id="btn-close-goal-modal">&times;</button>
        </div>
        <form id="goal-form">
          <div class="form-group">
            <label class="form-label" for="goal-name">Goal Name</label>
            <input type="text" id="goal-name" class="form-control" placeholder="e.g. New Gaming PC" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="goal-target">Target Amount (₹)</label>
              <input type="number" id="goal-target" class="form-control" placeholder="60000" min="1" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="goal-current">Initial Amount (₹)</label>
              <input type="number" id="goal-current" class="form-control" placeholder="10000" min="0" required />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="goal-deadline">Target Deadline</label>
            <input type="date" id="goal-deadline" class="form-control" required />
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="btn-cancel-goal-modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Create Goal</button>
          </div>
        </form>
      </div>
    </div>

    <script src="src/state.js"></script>
    <script src="src/analytics.js"></script>
  </body>
</html>
